<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <!-- nav class -->
        <nav>
            <div class="left">
                <h1>Kanban</h1>
            </div>

            <div class="right">
                <button id="toggle-modal">Add New Task</button>
            </div>
        </nav>

        <!-- section class -->
        <section class="board">
            <!-- 3 sub class in section -->

            <!-- 1st -->
            <div class="task-column" id="todo">
                <div class="heading">
                    <div class="left">
                        <h2>To Do</h2>
                    </div>
                    <div class="right">
                        <span class="count">0</span>
                    </div>
                </div>
            </div>

            <!-- 2nd -->
            <div class="task-column" id="progress">
                <div class="heading">
                    <div class="left">
                        <h2>In Progress</h2>
                    </div>
                    <div class="right">
                        <span class="count">0</span>
                    </div>
                </div>
            </div>

            <!-- 3rd -->
            <div class="task-column" id="done">
                <div class="heading">
                    <div class="left">
                        <h2>Done</h2>
                    </div>
                    <div class="right">
                        <span class="count">0</span>
                    </div>
                </div>
            </div>

        </section>

        <div class="modal" id="modal">

            <div class="bg"></div>

            <div  class="center">
                <input 
                        type="text" 
                        placeholder="Task Title" 
                        id="task-title-input"
                > 

                <textarea placeholder="Task Description" id="task-description-input">
                </textarea>

                <button id="add-task">Add Task</button>
            </div>

        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
