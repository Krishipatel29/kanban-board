<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <!-- nav class -->
        <nav>
            <div class="left">
                <h1>Kanban</h1>
            </div>

            <div class="right">
                <button>Add New Task</button>
            </div>
        </nav>

        <!-- section class -->
        <section class="board">
            <!-- 3 sub class in section -->

            <!-- 1st -->
            <div class="task-column">
                <div class="heading">
                    <div class="left">
                        <h2>To Do</h2>
                    </div>
                    <div class="right">
                        <span class="count">0</span>
                    </div>
                </div>


                <div class="task" draggable="true">
                    <h2>Task One</h2>
                    <p>Task description for Task One</p>
                    <button>Delete</button>
                </div>
            </div>

            <!-- 2nd -->
            <div class="task-column">
                <div class="heading">
                    <div class="left">
                        <h2>In Progress</h2>
                    </div>
                    <div class="right">
                        <span class="count">0</span>
                    </div>
                </div>
            </div>

            <!-- 3rd -->
            <div class="task-column">
                <div class="heading">
                    <div class="left">
                        <h2>Done</h2>
                    </div>
                    <div class="right">
                        <span class="count">0</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
